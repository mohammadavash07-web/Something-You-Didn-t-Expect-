<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Birthday Surprise 💗</title><style>
  *{box-sizing:border-box}body{margin:0;padding:24px 16px;min-height:100vh;background:linear-gradient(135deg,#fff7fb,#ffe5f0);font-family:system-ui,sans-serif;color:#60374d;text-align:center}
  main{max-width:680px;margin:auto}h1{color:#c65c91;font-size:clamp(26px,6vw,38px)}.intro{font-size:17px;line-height:1.6}.gifts{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:13px;margin:28px 0}
  .gift{background:#fff;border:1px solid #f2bfd5;border-radius:18px;padding:20px 10px;box-shadow:0 7px 18px #a74c7118;cursor:pointer;color:#bd5688;font-weight:700;font-size:16px}
  .gift span{display:block;font-size:38px;margin-bottom:8px}.gift:active{transform:scale(.98)}
  #content{display:none;background:#fff;border:1px solid #f2bfd5;border-radius:20px;padding:22px;margin:18px auto;line-height:1.7;white-space:pre-wrap}
  #content img{max-width:100%;max-height:360px;object-fit:contain;border-radius:14px;margin-top:12px}
  #final{display:none;background:#fff;border-radius:20px;padding:24px;margin-top:20px;line-height:1.7}
  button{border:0;border-radius:12px;background:#bd5688;color:white;padding:12px 20px;font-weight:700;margin-top:15px}
  </style></head><body><main><h1 id="heading"></h1><p class="intro" id="welcome"></p><div class="gifts" id="gifts"></div><section id="content"></section><section id="final"></section><audio id="music" loop></audio></main>
  <script>const data={"heading":"Something Special For You ta ta thoi thoi💗","welcome":"Hello ta ta thoi thoi! And this is Avash!\nSo, welcome to my little world.\nA tiny place filled with love, surprises, and a little piece of me. It's all just for you. 💗","gifts":[{"title":"Tadaaaaa🪄","message":"Cholo ektu smriti charon kori! Prothom dine tmi nijeke pagol bolchila. Actually tmi asholey pagol. But cuteee💗","photo":""},{"title":"Helloooo","message":"Wait a minute! Tmi hashcho keno? Mukhe dekhi blush hocche. Jai hok ajker din ta onk special. That's why ami mojo khacchi🍷khaba?","photo":""},{"title":"Hiiiiiiiii","message":"Kichukkhon aga pizza khaychi. Onk moja! Fuchka khaba? Thaka ei gula khawar dorkar nai.","photo":""},{"title":"Eeeeeeeeeee","message":"Raag hocche? Hote thak🔪! Mone hoi onk shahosh dekhiye felechi:) to ki korba?","photo":""},{"title":"Meawwwww","message":"Jai hok, Rapunzel tmr favorite colour to pink so eta pink colour diyei make korchi. Oto tau valo hoyni, ik! Lavender ta add kora jeto but match korayte partam na. So are you ready for next and last stage?? 1️⃣2️⃣3️⃣","photo":""}],"final":"Helloooo tathoi. So tmr shathe amr porichoy hoyce 6 month. Ei 6 month er vitor tmk niye onk kichu jenechi, shunechi and bojhar try korchi. Actually ja ja observe korchi r sheta holo tmi onk valo ekta manush jodio pagol. Prothom din tmi bolechile, tmi naki beshi kotha bolo r eta naki onner posondo na. But still tmk etai bolbo, nijer bortoman k dhore rakho. Ekhon jmn acho thik tmne thako. Tmi tmr ei sotto life a onk kichu face korcho. Oneker asha jaua dekhecho. Inshallah ekdin shob thik hoye jabe. Ami jani na amader future ki but ami chai tmi present and future onk happy thako. J happy ta tmi deserve koro na shetai jeno tmi pau. R jibon onk soto so ei jibon ta k britha jete diyo na. Proti ta shomoy protira muhurto enjoy koro.\nHappy birthday my dear ta ta thoi thoi. \nAmi bujtechi na ki bolbo. But nijer jonno baccho. R nijeke valobasho. And thank you so much Uncle and Aunty, for these crazy pitches!","music":""};document.getElementById('heading').textContent=data.heading;document.getElementById('welcome').textContent=data.welcome;
  const opened=new Set();const grid=document.getElementById('gifts'),content=document.getElementById('content');
  data.gifts.forEach((g,i)=>{const b=document.createElement('button');b.className='gift';b.innerHTML='<span>🎁</span>';const t=document.createElement('span');t.textContent=g.title;b.appendChild(t);b.onclick=()=>{content.style.display='block';content.textContent=g.message;if(g.photo){const im=document.createElement('img');im.src=g.photo;content.appendChild(im)}opened.add(i);if(opened.size===5){const f=document.getElementById('final');f.style.display='block';f.textContent=data.final}};grid.appendChild(b)});
  if(data.music){const a=document.getElementById('music');a.src=data.music;const start=()=>a.play().catch(()=>{});document.body.addEventListener('click',start,{once:true})}
  </script></body></html>
